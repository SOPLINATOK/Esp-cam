<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تجربة ESP بالكاميرا</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    .wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }
    video, canvas {
      max-width: 100vw;
      height: auto;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    button {
      margin: 12px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>تجربة ESP Box + Skeleton + Line + الطول</h3>
  <button id="startBtn">تشغيل الكاميرا</button>
  <div class="wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");

    const FOCAL_PX = 700;
    const DISTANCE_M = 2.5;

    const EDGES = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24],
      [23, 25], [25, 27], [24, 26], [26, 28]
    ];

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const lm = results.poseLandmarks;
      if (!lm || lm.length === 0) return;

      const visible = lm.filter(p => (p.visibility ?? 1) > 0.5);
      if (visible.length < 4) return;

      const xs = visible.map(p => p.x * canvas.width);
      const ys = visible.map(p => p.y * canvas.height);

      const x1 = Math.min(...xs);
      const y1 = Math.min(...ys);
      const x2 = Math.max(...xs);
      const y2 = Math.max(...ys);

      ctx.strokeStyle = "#00ff00";
      ctx.lineWidth = 2;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

      ctx.strokeStyle = "#00ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height);
      ctx.lineTo((x1 + x2) / 2, y2);
      ctx.stroke();

      ctx.strokeStyle = "#ff9800";
      ctx.lineWidth = 2;
      for (const [a, b] of EDGES) {
        if (lm[a] && lm[b] && (lm[a].visibility ?? 1) > 0.5 && (lm[b].visibility ?? 1) > 0.5) {
          ctx.beginPath();
          ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
          ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
          ctx.stroke();
        }
      }

      const hPx = Math.max(1, y2 - y1);
      const heightM = (hPx * DISTANCE_M) / FOCAL_PX;
      const heightCm = heightM * 100;

      ctx.fillStyle = "#00ff00";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`H: ${Math.round(heightCm)} cm (${heightM.toFixed(2)} m)`, x1, Math.max(22, y1 - 8));
    });

    async function processLoop() {
      if (video.readyState >= 2) {
        await pose.send({ image: video });
      }
      requestAnimationFrame(processLoop);
    }

    startBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        startBtn.style.display = "none";
        processLoop();
      } catch (err) {
        alert("تعذر فتح الكاميرا: تأكد من إعطاء صلاحية الكاميرا وفتح الصفحة عبر HTTPS.");
      }
    });
  </script>
</body>
</html>
